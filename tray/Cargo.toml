[package]
name = "tray"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Headless StatusNotifierItem (SNI) tray data layer with embedded fallback watcher and DBusMenu client"

[dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
thiserror = "2"

[features]
default = []
testing = []

[[bin]]
name = "tray-inspect"
path = "src/bin/tray-inspect.rs"

[[test]]
name = "integration"
required-features = ["testing"]

[[example]]
name = "demo-item"
required-features = ["testing"]

[[example]]
name = "minimal"

[[example]]
name = "demo-watcher-switch"
required-features = ["testing"]
