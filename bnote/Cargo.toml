[package]
name = "bnote"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "org.freedesktop.Notifications protocol server for breadknife"

[dependencies]
enumflags2 = "0.7"
futures-util = "0.3"
tokio = { version = "1", default-features = false, features = ["sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
