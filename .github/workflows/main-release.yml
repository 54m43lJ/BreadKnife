name: Main Build & Release

on:
  push:
    branches: [main]    # main 上的任何 merge / 直接 commit 都触发打包
  workflow_dispatch:

# 连续提交时，新 run 直接取消还在跑的旧 run，只保留最新一次
concurrency:
  group: main-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PKG_CONFIG_PATH: "/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig"
  RELEASE_TAG: preview
  RELEASE_NAME: "Preview Build"
  BINARY_NAME: "bread"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            meson \
            ninja-build \
            libgtk-4-dev \
            libglib2.0-dev \
            libwayland-dev \
            dbus

      - name: Build gtk4-layer-shell
        run: |
          git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git
          cd gtk4-layer-shell
          # 仅需 C 库与 pkg-config：关闭 introspection/vapi（其默认开启，会要求 gobject-introspection-1.0）
          meson setup build -Dexamples=false -Ddocs=false -Dtests=false -Dintrospection=false -Dvapi=false
          sudo meson install -C build
          sudo ldconfig

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-cargo-

      - name: Test breadpan (library)
        run: dbus-run-session -- cargo test --manifest-path breadpan/Cargo.toml --locked

      - name: Test breadknife (app)
        run: cargo test --locked

      - name: Build Release
        run: cargo build --release --bin bread --target x86_64-unknown-linux-gnu --locked

      - name: Package Binary
        id: package
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d '"' -f2)
          ARCHIVE_NAME="${BINARY_NAME}-v${VERSION}-x86_64-unknown-linux-gnu"
          tar czf "${ARCHIVE_NAME}.tar.gz" -C "target/x86_64-unknown-linux-gnu/release" "${BINARY_NAME}"
          echo "archive=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: artifacts

      - name: Create/Update Alpha Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ## Preview Build (Linux AMD64)

            **Commit:** ${{ github.sha }}
            **Triggered by:** ${{ github.actor }}

            ⚠️ 此 release 会被 main 上的每次提交自动覆盖。
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: "artifacts/*"
          token: ${{ secrets.GITHUB_TOKEN }}
