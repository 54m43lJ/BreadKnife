[package]
name = "breadknife"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bread"
path = "src/main.rs"

[dependencies]
breadpan = { path = "breadpan" }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
gtk4-layer-shell = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
